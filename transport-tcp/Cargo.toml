# SPDX-License-Identifier: Apache-2.0
[package]
name = "busbar-transport-tcp"
version = "1.6.0"
publish = false            # a first-party plugin crate; shipped linked into busbar or as a signed tarball
edition = "2021"
rust-version.workspace = true
description = "The tcp transport: a carrier of the host's byte stream (listen, accept, dial, read, write; every framer op refused)."
license = "Apache-2.0"

[lints]
workspace = true

[lib]
# rlib: the LINKED door (`door`), which a busbar build names as a compiled-in row. The
# dropped-in door is the sibling `busbar-transport-tcp-plugin` cdylib, which exports this same door
# as its one symbol; this crate exports none.
crate-type = ["rlib"]

# DEPENDENCY POLICY. A transport is a plugin, so its closure is `busbar-contract` and nothing else it
# does not need. This one needs nothing else: the socket, its readiness and its clock are the host's.
[dependencies]
# The ONE busbar crate a plugin names. Pinned by git rev to the busbar commit in `.busbar-ref`; a
# busbar build that links this crate `[patch]`es the busbar git source to its own tree, so ONE copy
# of the contract links.
busbar-contract = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
jsonschema = { workspace = true }
busbar-contract = { workspace = true, features = ["test-seal"] }

[package.metadata.busbar.test-contexts]
linked_transport_rows = [{ path = "tests/root/linked_door_root.rs" }]
boot_carrier_locate = [{ path = "tests/root/boot_locate.rs" }]
listener_carrier = [{ path = "tests/root/listener_carrier.rs" }]
