# SPDX-License-Identifier: Apache-2.0
#
# One repo per plugin (owner ruling, busbar 1.6.0): this repo brings 100% of what the `tcp`
# transport needs — the wire itself (busbar-transport-tcp, the rlib busbar's composition root links
# as its `transport-tcp` row, the wire floor every other transport composes over) and the thin
# cdylib that packages it as a droppable `kind: transport` plugin (busbar-transport-tcp-plugin) — as
# a same-repo Cargo workspace, laid out like store-mysql.
#
# Its one busbar dependency is busbar-contract (busbar-plugin-loader too, dev-only for the
# conformance test), a git dependency on GetBusbar/busbar pinned to the rev in `.busbar-ref`
# field 1. No sibling-checkout path dependency ships in any manifest.
[workspace]
resolver = "2"
members = [
    "transport-tcp",
    "transport-tcp-plugin",
]
